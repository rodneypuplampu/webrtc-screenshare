
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Metrics Collector</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #0056b3; /* A blue tone */
        }
        #status {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 4px;
            display: inline-block; /* Allows padding and background */
        }
        .status-idle { background-color: #e0e0e0; color: #555; }
        .status-connecting { background-color: #fff3cd; color: #856404; }
        .status-connected { background-color: #d4edda; color: #155724; }
        .status-collecting { background-color: #cce5ff; color: #004085; }
        .status-error { background-color: #f8d7da; color: #721c24; }
        .status-closed { background-color: #f8d7da; color: #721c24; }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-size: 1em;
            transition: background-color 0.2s ease;
        }
        button:hover:not(:disabled) {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        pre {
            background-color: #eee;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;       /* Allow wrapping */
            word-wrap: break-word;      /* Break long words/strings */
            max-height: 400px;          /* Limit height */
            overflow-y: auto;           /* Add scrollbar if needed */
            border: 1px solid #ddd;
            font-family: Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
            font-size: 0.9em;
        }
        .controls {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>WebRTC Network Metrics Collector</h1>

        <div class="status-section">
            Status: <span id="status" class="status-idle">Idle</span>
        </div>

        <div class="controls">
            <button id="startButton" disabled>Start Collecting</button>
            <button id="stopButton" disabled>Stop Collecting</button>
        </div>

        <h2>Last Metrics Batch Collected:</h2>
        <pre id="metricsDisplay">No metrics collected yet.</pre>
    </div>

    <script src="client.js"></script>
</body>
</html>
